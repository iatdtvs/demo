<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background: white;
        }

        .hero h1 {
            font-size: 50px;
        }

        .hero p {
            font-size: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .section {
            padding: 60px 20px;
            text-align: center;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

    </style>

</head>

<body>

<header>
    <h1>My Website</h1>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</nav>

<section class="hero" id="home">

    <h1>MY GITHUB WEBSITE IS WORKING</h1>

    <p>
        This website is hosted using GitHub Pages.
    </p>

    <button onclick="showMessage()">
        Click Me
    </button>

</section>

<section class="section" id="about">

    <h2>About</h2>

    <p>
        This is my first GitHub website.
    </p>

</section>

<section class="section" id="contact">

    <h2>Contact</h2>

    <p>
        Email: example@email.com
    </p>

</section>

<footer>

    <p>© 2026 My Website</p>

</footer>

<script>

function showMessage() {

    alert("Welcome to my website!");

}

</script>

</body>

</html>
